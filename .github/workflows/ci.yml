name: CI Pipeline - Scouting Dashboard

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  # ========================================================
  # JOB 1: Backend CI (Python, FastAPI, Pytest, SonarCloud)
  # ========================================================
  backend-ci:
    name: Backend CI (Python & FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Clave para que SonarQube tenga el historial de git (blame)

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: api-backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest with Coverage
        run: |
          pytest --cov=. --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: SonarQube / SonarCloud Static Code Analysis
        uses: SonarSource/sonarcloud-github-action@v3
        with:
          projectBaseDir: api-backend
          args: >
            -Dsonar.projectKey=scouting-dashboard-api
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.sources=.
            -Dsonar.tests=tests
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.exclusions=**/__pycache__/**,tests/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ========================================================
  # JOB 2: Frontend CI (Node.js, Angular, Karma, SonarCloud)
  # ========================================================
  frontend-ci:
    name: Frontend CI (Angular & Karma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: web-frontend/package-lock.json

      - name: Install Dependencies (Clean Install)
        run: npm ci

      - name: Run Angular Tests (Headless Karma/Jasmine)
        run: |
          npm test -- --no-watch --no-progress --browsers=ChromeHeadless --code-coverage
        env:
          CHROME_BIN: /usr/bin/google-chrome

      - name: Build Angular for Production
        run: npm run build -- --configuration production

      - name: SonarQube / SonarCloud Static Code Analysis
        uses: SonarSource/sonarcloud-github-action@v3
        with:
          projectBaseDir: web-frontend
          args: >
            -Dsonar.projectKey=scouting-dashboard-web
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=**/*.spec.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
